name: Website CI/CD Build, Test & Deploy (website.yml)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test-website:
    name: Lint, Test & Build Website Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript Typecheck & Linting
        run: npm run lint

      - name: Run Security & Download Lifecycle Unit Tests
        run: npm test

      - name: Build Production Website & PWA Assets
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Add SPA Fallback (404.html) & .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Production Website Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noir-website-dist
          path: dist/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # Fallback Deploy via Peaceiris gh-pages branch (works even when GitHub Pages Actions is disabled in repo settings)
      - name: Deploy to gh-pages branch fallback
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          enable_jekyll: false

  deploy-website-pages:
    name: Deploy Website to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build-and-test-website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
