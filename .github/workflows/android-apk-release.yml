name: Build Android APK & Create GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-android-apk:
    name: Compile Web Bundle & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Dependencies & Build Production Web Bundle
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Install Capacitor Android CLI & Scaffold Android Project
        run: |
          npm install --no-audit --no-fund @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK (Debug & Release)
        id: build-apk
        working-directory: ./android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon || ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon || true

      - name: Prepare NOIR Video Studio APK Artifacts
        run: |
          mkdir -p release-artifacts
          find android -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            cp "$apk" "release-artifacts/NOIR-Video-Studio-${filename}"
          done

          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/NOIR-Video-Studio-debug.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/NOIR-Video-Studio-release-unsigned.apk
          fi

          tar -czf release-artifacts/NOIR-Video-Studio-web-dist.tar.gz dist capacitor.config.json

          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Upload APK Artifact to GitHub Actions Run (Guaranteed Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-Video-Studio-APK
          path: release-artifacts/*
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag != '' && inputs.release_tag || format('v2.0.{0}', github.run_number) }}
          name: "NOIR Video Studio Android APK ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag != '' && inputs.release_tag || format('v2.0.{0}', github.run_number) }}"
          body: |
            ## NOIR Video Studio (Robiul Video Studio) — Android Release

            ### 📱 ডাউনলোডযোগ্য সরাসরি ইনস্টলযোগ্য APK:
            - **`NOIR-Video-Studio-debug.apk`**: সরাসরি যেকোনো অ্যান্ড্রয়েড ফোনে ইনস্টলযোগ্য APK।
            - **`NOIR-Video-Studio-release-unsigned.apk`**: প্রোডাকশন রিলিজ APK।
            - **`SHA256SUMS.txt`**: ক্রিপ্টোগ্রাফিক ভেরিফিকেশন চেকসাম।

            Build Run: #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
