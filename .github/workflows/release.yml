name: Build Android APK & Create GitHub Release (release.yml)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release-android-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Node Dependencies & Build Web Assets
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Setup Capacitor & Scaffold Android Project
        run: |
          npm install --no-audit --no-fund @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug & Release APK
        working-directory: ./android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon || ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon || true

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          # Copy any generated APKs
          find android -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            cp "$apk" "release-artifacts/NOIR-Video-Studio-${filename}"
          done
          
          # If specific standard paths exist, normalize filenames
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/NOIR-Video-Studio-debug.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/NOIR-Video-Studio-release-unsigned.apk
          fi

          # Also package complete production bundle & ready-to-run project
          tar -czf release-artifacts/NOIR-Video-Studio-web-dist.tar.gz dist capacitor.config.json
          
          # Compute cryptographic checksums
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Upload Artifacts to GitHub Actions Run (Always Available)
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-Video-Studio-APK-Bundle
          path: release-artifacts/*
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag != '' && inputs.release_tag || format('v2.0.{0}', github.run_number) }}
          name: "NOIR Video Studio Android APK & Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag != '' && inputs.release_tag || format('v2.0.{0}', github.run_number) }}"
          body: |
            ## 🎬 NOIR Video Studio (Robiul Video Studio) — Android Release
            
            ### 📱 Downloadable Android APK Assets:
            - **`NOIR-Video-Studio-debug.apk`**: Direct installable Android APK (Android 8.0+).
            - **`NOIR-Video-Studio-release-unsigned.apk`**: Release APK ready for signing.
            - **`NOIR-Video-Studio-web-dist.tar.gz`**: Production web bundle.
            - **`SHA256SUMS.txt`**: Cryptographic SHA-256 checksums for security verification.

            _Triggered by ${{ github.event_name }} on commit ${{ github.sha }}_
          files: release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
